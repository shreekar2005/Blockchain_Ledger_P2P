[General]
network = SupplyChainNetwork
sim-time-limit = 1000s

SupplyChainNetwork.numSeeds = 5
SupplyChainNetwork.numPeers = 10

*.node[*].hashPower = 10.0 
*.node[*].killTime = -1s
*.node[*].invalidTxTime = -1s
*.node[*].doubleSpendTime = -1s
*.node[*].invalidBlockTime = -1s

# --- DEMO SCENARIOS ---
*.peer[5].killTime = 100s
*.peer[2].invalidTxTime = 50s
*.peer[3].doubleSpendTime = 150s
*.peer[4].invalidBlockTime = 200s
# ----------------------

*.seed[*].startUpTime = 0s

*.peer[0..4].startUpTime = 5s
*.peer[5..9].startUpTime = 15s